
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OmarSports - Tactics Builder</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #080d16;
    color: white;
    min-height: 100vh;
}

header {
    padding: 22px 15px;
    text-align: center;
    background: #101a2b;
    border-bottom: 2px solid #b5ff35;
}

header h1 {
    color: #b5ff35;
    font-size: 27px;
    letter-spacing: 2px;
}

header p {
    color: #9ca9bb;
    font-size: 12px;
    margin-top: 7px;
}

.container {
    max-width: 950px;
    margin: auto;
    padding: 20px 15px;
}

.section {
    background: #111c2d;
    padding: 18px;
    border-radius: 14px;
    margin-bottom: 20px;
    border: 1px solid #26364d;
}

.section h2 {
    font-size: 15px;
    margin-bottom: 15px;
    color: #b5ff35;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.clubs {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 10px;
}

.club {
    background: #19263a;
    border: 2px solid transparent;
    color: white;
    border-radius: 12px;
    padding: 12px 5px;
    cursor: pointer;
    transition: .2s;
}

.club:hover {
    background: #263750;
}

.club.active {
    border-color: #b5ff35;
    background: #263b27;
}

.club img {
    width: 55px;
    height: 55px;
    object-fit: contain;
    display: block;
    margin: auto auto 8px;
}

.club span {
    font-size: 11px;
    font-weight: bold;
}

.formations {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
}

.formation {
    background: #19263a;
    color: white;
    border: 1px solid #35445b;
    border-radius: 9px;
    padding: 13px 5px;
    font-weight: bold;
    cursor: pointer;
}

.formation.active {
    background: #b5ff35;
    color: #101820;
    border-color: #b5ff35;
}

.description {
    color: #aebbd0;
    font-size: 12px;
    line-height: 1.6;
    margin-top: 13px;
}

.pitch-wrapper {
    padding: 12px;
    background: #111c2d;
    border-radius: 14px;
    border: 1px solid #26364d;
}

.pitch-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 12px;
}

.pitch-heading h2 {
    font-size: 15px;
    color: #b5ff35;
}

.pitch-heading span {
    font-size: 11px;
    color: #aebbd0;
}

.pitch {
    width: 100%;
    max-width: 650px;
    aspect-ratio: 0.72;
    margin: auto;
    position: relative;
    overflow: hidden;
    background: repeating-linear-gradient(
        0deg,
        #16804a 0px,
        #16804a 65px,
        #147442 65px,
        #147442 130px
    );
    border: 3px solid white;
}

.pitch-line {
    position: absolute;
    border: 2px solid rgba(255,255,255,.85);
    pointer-events: none;
}

.center-line {
    width: 100%;
    top: 50%;
    border-width: 2px 0 0;
}

.center-circle {
    width: 25%;
    aspect-ratio: 1;
    border-radius: 50%;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
}

.penalty-top {
    width: 55%;
    height: 14%;
    top: 0;
    left: 22.5%;
    border-top: 0;
}

.penalty-bottom {
    width: 55%;
    height: 14%;
    bottom: 0;
    left: 22.5%;
    border-bottom: 0;
}

.goal-top {
    width: 27%;
    height: 5%;
    top: 0;
    left: 36.5%;
    border-top: 0;
}

.goal-bottom {
    width: 27%;
    height: 5%;
    bottom: 0;
    left: 36.5%;
    border-bottom: 0;
}

.player {
    position: absolute;
    transform: translate(-50%, -50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    z-index: 5;
    cursor: default;
    transition: top .35s, left .35s;
}

.player-logo {
    width: clamp(28px, 6vw, 43px);
    height: clamp(28px, 6vw, 43px);
    border-radius: 50%;
    background: #08111c;
    border: 2px solid #b5ff35;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 4px;
    box-shadow: 0 2px 9px #07130c;
}

.player-logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

.player-name {
    background: #07111d;
    color: white;
    padding: 3px 6px;
    border-radius: 4px;
    margin-top: 3px;
    font-size: clamp(8px, 1.8vw, 10px);
    font-weight: bold;
    white-space: nowrap;
    border: 1px solid rgba(181,255,53,.6);
}

.club-info {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    margin-top: 15px;
    padding: 12px;
    background: #19263a;
    border-radius: 10px;
}

.club-info img {
    width: 40px;
    height: 40px;
    object-fit: contain;
}

.club-info h3 {
    font-size: 14px;
}

.club-info p {
    color: #aebbd0;
    font-size: 11px;
    margin-top: 4px;
}

footer {
    text-align: center;
    color: #758399;
    font-size: 11px;
    padding: 25px 10px;
}

@media(max-width:500px) {
    .clubs {
        gap: 6px;
    }

    .club {
        padding: 10px 2px;
    }

    .club img {
        width: 43px;
        height: 43px;
    }

    .club span {
        font-size: 9px;
    }

    .section {
        padding: 13px;
    }

    header h1 {
        font-size: 23px;
    }
}
</style>
</head>

<body>

<header>
    <h1>OMARSPORTS</h1>
    <p>FOOTBALL TACTICS BUILDER</p>
</header>

<main class="container">

    <!-- CLUB SELECTOR -->
    <section class="section">
        <h2>⚽ Pilih Klub</h2>

        <div class="clubs">

            <button class="club active" onclick="selectClub('arsenal')" id="club-arsenal">
                <img src="https://media.api-sports.io/football/teams/42.png" alt="Arsenal">
                <span>ARSENAL</span>
            </button>

            <button class="club" onclick="selectClub('mancity')" id="club-mancity">
                <img src="https://media.api-sports.io/football/teams/50.png" alt="Manchester City">
                <span>MAN CITY</span>
            </button>

            <button class="club" onclick="selectClub('liverpool')" id="club-liverpool">
                <img src="https://media.api-sports.io/football/teams/40.png" alt="Liverpool">
                <span>LIVERPOOL</span>
            </button>

            <button class="club" onclick="selectClub('astonvilla')" id="club-astonvilla">
                <img src="https://media.api-sports.io/football/teams/66.png" alt="Aston Villa">
                <span>ASTON VILLA</span>
            </button>

        </div>
    </section>

    <!-- FORMATION -->
    <section class="section">
        <h2>📋 Pilih Formasi</h2>

        <div class="formations">
            <button class="formation active" id="form-433"
                onclick="changeFormation('433')">4-3-3</button>

            <button class="formation" id="form-4231"
                onclick="changeFormation('4231')">4-2-3-1</button>

            <button class="formation" id="form-352"
                onclick="changeFormation('352')">3-5-2</button>
        </div>

        <p class="description" id="description">
            Formasi menyerang dengan tiga pemain depan dan dominasi lini tengah.
        </p>
    </section>

    <!-- PITCH -->
    <section class="pitch-wrapper">

        <div class="pitch-heading">
            <h2>🏟️ TACTICAL BOARD</h2>
            <span id="formation-label">FORMASI 4-3-3</span>
        </div>

        <div class="pitch" id="pitch">

            <div class="pitch-line center-line"></div>
            <div class="pitch-line center-circle"></div>
            <div class="pitch-line penalty-top"></div>
            <div class="pitch-line penalty-bottom"></div>
            <div class="pitch-line goal-top"></div>
            <div class="pitch-line goal-bottom"></div>

            <div id="players"></div>

        </div>

        <div class="club-info">
            <img id="selected-logo"
                src="https://media.api-sports.io/football/teams/42.png"
                alt="Selected Club">
            <div>
                <h3 id="selected-name">ARSENAL</h3>
                <p id="selected-formation">Starting XI • 4-3-3</p>
            </div>
        </div>

    </section>

</main>

<footer>
    © 2026 OMARSPORTS | FOOTBALL TACTICS BUILDER
</footer>

<script>

/* CLUB DATABASE */

const clubs = {
    arsenal: {
        name: "ARSENAL",
        logo: "https://media.api-sports.io/football/teams/42.png"
    },

    mancity: {
        name: "MANCHESTER CITY",
        logo: "https://media.api-sports.io/football/teams/50.png"
    },

    liverpool: {
        name: "LIVERPOOL",
        logo: "https://media.api-sports.io/football/teams/40.png"
    },

    astonvilla: {
        name: "ASTON VILLA",
        logo: "https://media.api-sports.io/football/teams/66.png"
    }
};

/* FORMATION DATABASE */

const formations = {

    "433": {
        description:
        "Formasi menyerang dengan tiga pemain depan. Cocok untuk pressing tinggi dan permainan sayap.",

        positions: [
            ["GK", 88, 50],
            ["LB", 72, 15],
            ["CB", 76, 38],
            ["CB", 76, 62],
            ["RB", 72, 85],
            ["CM", 54, 28],
            ["CDM", 60, 50],
            ["CM", 54, 72],
            ["LW", 25, 17],
            ["ST", 17, 50],
            ["RW", 25, 83]
        ]
    },

    "4231": {
        description:
        "Formasi seimbang dengan dua gelandang bertahan dan satu playmaker di belakang striker.",

        positions: [
            ["GK", 88, 50],
            ["LB", 72, 15],
            ["CB", 76, 38],
            ["CB", 76, 62],
            ["RB", 72, 85],
            ["CDM", 60, 35],
            ["CDM", 60, 65],
            ["LM", 37, 15],
            ["CAM", 39, 50],
            ["RM", 37, 85],
            ["ST", 17, 50]
        ]
    },

    "352": {
        description:
        "Formasi dominasi lini tengah dengan tiga bek, dua wing-back, dan dua striker.",

        positions: [
            ["GK", 88, 50],
            ["CB", 76, 22],
            ["CB", 79, 50],
            ["CB", 76, 78],
            ["LWB", 48, 12],
            ["CM", 55, 32],
            ["CDM", 60, 50],
            ["CM", 55, 68],
            ["RWB", 48, 88],
            ["ST", 19, 35],
            ["ST", 19, 65]
        ]
    }

};

let selectedClub = "arsenal";
let currentFormation = "433";

/* SELECT CLUB */

function selectClub(key) {

    if (!clubs[key]) return;

    selectedClub = key;

    document.querySelectorAll(".club").forEach(btn => {
        btn.classList.remove("active");
    });

    document.getElementById("club-" + key)
        .classList.add("active");

    document.getElementById("selected-name").textContent =
        clubs[key].name;

    document.getElementById("selected-logo").src =
        clubs[key].logo;

    renderPlayers();
}

/* CHANGE FORMATION */

function changeFormation(key) {

    if (!formations[key]) return;

    currentFormation = key;

    document.querySelectorAll(".formation").forEach(btn => {
        btn.classList.remove("active");
    });

    document.getElementById("form-" + key)
        .classList.add("active");

    document.getElementById("description").textContent =
        formations[key].description;

    document.getElementById("formation-label").textContent =
        "FORMASI " + key.replace("4231", "4-2-3-1")
                        .replace("433", "4-3-3")
                        .replace("352", "3-5-2");

    document.getElementById("selected-formation").textContent =
        "Starting XI • " +
        key.replace("4231", "4-2-3-1")
           .replace("433", "4-3-3")
           .replace("352", "3-5-2");

    renderPlayers();
}

/* RENDER PLAYERS */

function renderPlayers() {

    const container = document.getElementById("players");

    container.innerHTML = "";

    const club = clubs[selectedClub];

    formations[currentFormation].positions.forEach((pos, index) => {

        const player = document.createElement("div");

        player.className = "player";

        player.style.top = pos[1] + "%";
        player.style.left = pos[2] + "%";

        const logo = document.createElement("div");
        logo.className = "player-logo";

        const img = document.createElement("img");
        img.src = club.logo;
        img.alt = club.name;
        img.loading = "lazy";

        logo.appendChild(img);

        const name = document.createElement("span");
        name.className = "player-name";
        name.textContent = pos[0];

        player.appendChild(logo);
        player.appendChild(name);

        container.appendChild(player);

    });

}

/* INITIALIZE */

renderPlayers();

</script>

</body>
</html>
